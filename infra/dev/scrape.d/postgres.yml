# Scrape extra SOLO de dev: el Postgres local del stack (en prod lo scrapea el exporter
# del core sobre el Postgres compartido).
#
# NOTA: los ficheros de `scrape_config_files` NO son listas peladas — Prometheus los
# deserializa como un mapping con clave `scrape_configs` (una lista `- job_name:` pelada
# lo hace crashear con "cannot unmarshal !!seq into config.ScrapeConfigs").
scrape_configs:
    - job_name: proxy-control-postgres
      static_configs:
          - targets: ['proxy-control-postgres-exporter:9187']
