<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
    <defs>
        <linearGradient id="pc-stroke" x1="26" y1="64" x2="102" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#6c8cff" />
            <stop offset="1" stop-color="#24e0a3" />
        </linearGradient>
    </defs>

    <rect x="4" y="4" width="120" height="120" rx="28" fill="#0f1521" />
    <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" fill="none" stroke="#1e2836" />

    <!-- routing paths: one source splits into public (top) and private (bottom) -->
    <path
        d="M32 64 H52 C64 64 64 40 76 40 H96 M52 64 C64 64 64 88 76 88 H96"
        stroke="url(#pc-stroke)"
        stroke-width="7"
        stroke-linecap="round"
        stroke-linejoin="round"
    />

    <!-- source node -->
    <circle cx="32" cy="64" r="11" fill="#0f1521" stroke="#6c8cff" stroke-width="7" />
    <!-- public node -->
    <circle cx="96" cy="40" r="9" fill="#38d0ff" />
    <!-- private node -->
    <circle cx="96" cy="88" r="9" fill="#24e0a3" />
</svg>
