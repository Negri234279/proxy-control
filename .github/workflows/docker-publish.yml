name: Docker publish

# Build & push multi-arch (amd64 + arm64) de negrii/proxy-control cuando cambia el código
# o el Dockerfile en master. Etiqueta `latest` + la versión de package.json. La Pi
# (watchtower) recoge `latest`.

on:
    push:
        branches: [master, main]
        paths:
            - 'src/**'
            - 'public/**'
            - 'drizzle/**'
            - 'package.json'
            - 'package-lock.json'
            - 'astro.config.mjs'
            - 'tsconfig.json'
            - 'infra/Dockerfile'
            - '.dockerignore'
            - '.github/workflows/docker-publish.yml'
    workflow_dispatch: {}

concurrency:
    group: docker-publish-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    IMAGE: negrii/proxy-control

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Read version
              id: version
              run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME || 'negrii' }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Compute tags
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE }}
                  tags: |
                      type=raw,value=latest
                      type=raw,value=${{ steps.version.outputs.value }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./infra/Dockerfile
                  target: runtime
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      VERSION=${{ steps.version.outputs.value }}
                      VCS_REF=${{ github.sha }}
                      VCS_URL=${{ github.server_url }}/${{ github.repository }}
                      BUILD_DATE=${{ github.event.head_commit.timestamp }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
