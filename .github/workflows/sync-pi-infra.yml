name: Sync infra → pi-infra

# Cuando cambia infra/ en master, espeja los ficheros relevantes al repo central
# pi-infra (apps/proxy-control + el pegamento de la Grafana del core), abre un PR y lo
# auto-mergea. El poller de despliegue de pi-infra lo recoge al hacer merge.
#
# Requiere el secreto PI_INFRA_SYNC_TOKEN: un PAT con `contents:write` +
# `pull-requests:write` sobre el repo pi-infra.

on:
    push:
        branches: [master, main]
        paths:
            - 'infra/prod/**'
            - 'infra/observability/**'
            - 'scripts/sync-pi-infra.sh'
            - '.github/workflows/sync-pi-infra.yml'
    workflow_dispatch: {}

concurrency:
    group: sync-pi-infra
    cancel-in-progress: false

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout proxy-control (source)
              uses: actions/checkout@v4
              with:
                  path: proxy-control

            - name: Checkout pi-infra (target)
              uses: actions/checkout@v4
              with:
                  repository: Negri234279/pi-infra
                  token: ${{ secrets.PI_INFRA_SYNC_TOKEN }}
                  path: pi-infra

            - name: Apply sync contract
              run: bash proxy-control/scripts/sync-pi-infra.sh "${{ github.workspace }}/pi-infra"

            - name: Open PR in pi-infra
              id: cpr
              uses: peter-evans/create-pull-request@v8
              with:
                  path: pi-infra
                  token: ${{ secrets.PI_INFRA_SYNC_TOKEN }}
                  branch: sync/proxy-control-infra
                  delete-branch: true
                  sign-commits: true
                  commit-message: 'chore(sync): proxy-control infra @ ${{ github.sha }}'
                  title: 'chore(sync): proxy-control infra'
                  body: |
                      Automated sync of proxy-control's `infra/` into this repo.

                      **Source:** `${{ github.repository }}@${{ github.sha }}`

                      Mirrors (per the sync contract, NO prod sublevel):
                      - `infra/prod/` → `apps/proxy-control/` (rewriting ../observability → ./observability)
                      - `infra/observability/` (minus grafana) → `apps/proxy-control/observability/`
                      - app dashboards → `core/grafana/dashboards/proxy-control/`
                      - datasources → `core/grafana/provisioning/datasources/proxy-control.yml`

                      🤖 Generated by the `sync-pi-infra` workflow.
                  labels: |
                      automated
                      infra-sync

            - name: Auto-merge the sync PR
              if: steps.cpr.outputs.pull-request-number != ''
              env:
                  GH_TOKEN: ${{ secrets.PI_INFRA_SYNC_TOKEN }}
                  PR: ${{ steps.cpr.outputs.pull-request-number }}
                  REPO: Negri234279/pi-infra
              run: |
                  gh pr merge "$PR" -R "$REPO" --squash --auto \
                    || gh pr merge "$PR" -R "$REPO" --squash --admin
